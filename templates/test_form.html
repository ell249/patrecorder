{% extends "base.html" %}
{% block title %}New Test{% endblock %}

{% block content %}

<h3 class="mb-4">New Test for {{ appliance.asset_number }}</h3>

<form method="post" enctype="multipart/form-data" class="row g-3">

    <!-- Test Date -->
    <div class="col-md-3">
        <label class="form-label">Test Date</label>
        <input type="date" name="test_date" class="form-control" required>
    </div>

    <!-- Tester Name -->
    <div class="col-md-5">
        <label class="form-label">Tester Name</label>
        <input type="text" name="tester_name" class="form-control" required>
    </div>

    <!-- Test Standard -->
    <div class="col-md-4">
        <label class="form-label">Test Standard</label>
        <select name="test_standard" class="form-select" required>
            <option value="3760">AS/NZS 3760</option>
            <option value="5761">AS/NZS 5761</option>
            <option value="5762">AS/NZS 5762</option>
        </select>
    </div>

    <!-- Tag Number -->
    <div class="col-md-4">
        <label class="form-label">Tag Number</label>
        <input type="text" name="tag_number" class="form-control" required>
    </div>

    <!-- Retest Interval -->
    <div class="col-md-4">
        <label class="form-label">Retest Interval (Days)</label>
        <input type="number" name="retest_interval" class="form-control"
               value="{{ suggested_rule.interval_days if suggested_rule else '' }}" required>
    </div>

    <!-- Test Type -->
    <div class="col-md-4">
        <label class="form-label">Test Type</label>
        <input type="text" name="test_type" class="form-control" required>
    </div>

    <hr class="mt-4">

    <!-- Visual Inspection Checklist -->
    <h4 class="mt-3">Visual Inspection Checklist</h4>
    <p class="text-muted">All PASS items must be satisfied unless marked N/A (where applicable).</p>

    <div class="col-md-6">

        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="vi_plug" id="vi_plug">
            <label class="form-check-label" for="vi_plug">Plug condition OK</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="vi_cord" id="vi_cord">
            <label class="form-check-label" for="vi_cord">Cord condition OK</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="vi_casing" id="vi_casing">
            <label class="form-check-label" for="vi_casing">No damage to casing</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="vi_overheat" id="vi_overheat">
            <label class="form-check-label" for="vi_overheat">No signs of overheating</label>
        </div>

    </div>

    <div class="col-md-6">

        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="vi_label" id="vi_label">
            <label class="form-check-label" for="vi_label">Rating label intact and legible</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="vi_exposed" id="vi_exposed">
            <label class="form-check-label" for="vi_exposed">No exposed conductors</label>
        </div>

        <!-- PASS / FAIL / N/A fields -->
        <div class="mt-3">
            <label class="form-label">Evidence of Unsafe Previous Repairs</label>
            <select name="vi_repairs" class="form-select">
                <option value="PASS">PASS</option>
                <option value="FAIL">FAIL</option>
                <option value="N/A">N/A</option>
            </select>
        </div>

        <div class="mt-3">
            <label class="form-label">Correct Cable Strain Relief</label>
            <select name="vi_strain" class="form-select">
                <option value="PASS">PASS</option>
                <option value="FAIL">FAIL</option>
                <option value="N/A">N/A</option>
            </select>
        </div>

        <div class="mt-3">
            <label class="form-label">Safety Functions / Guards Working</label>
            <select name="vi_guards" class="form-select">
                <option value="PASS">PASS</option>
                <option value="FAIL">FAIL</option>
                <option value="N/A">N/A</option>
            </select>
        </div>

    </div>

    <hr class="mt-4">

    <!-- Electrical Tests -->
    <h4 class="mt-3">Electrical Tests</h4>

    <div class="col-md-3">
        <label class="form-label">Earth Continuity (Ω)</label>
        <input type="text" name="earth_continuity_ohms" class="form-control">
    </div>

    <div class="col-md-3">
        <label class="form-label">Insulation Resistance (MΩ)</label>
        <input type="text" name="insulation_mohms" class="form-control">
    </div>

    <div class="col-md-3">
        <label class="form-label">Leakage Current (mA)</label>
        <input type="text" name="leakage_mA" class="form-control">
    </div>

    <div class="col-md-3">
        <label class="form-label">Polarity Pass</label><br>
        <input type="checkbox" name="polarity_pass" class="form-check-input">
    </div>

    <hr class="mt-4">

    <!-- Overall Result -->
    <div class="col-md-4">
        <label class="form-label">Overall Result</label>
        <select name="overall_result" class="form-select" required>
            <option value="PASS">PASS</option>
            <option value="FAIL">FAIL</option>
        </select>
    </div>

    <!-- Comments -->
    <div class="col-md-8">
        <label class="form-label">Comments</label>
        <textarea name="comments" class="form-control" rows="3"></textarea>
    </div>

    <!-- Photos -->
    <div class="col-md-12">
        <label class="form-label">Upload Photos</label>
        <input type="file" name="photos" class="form-control" multiple>
    </div>

    <div class="col-12 mt-4">
        <button type="submit" class="btn btn-success">Save Test</button>
        <a href="{{ url_for('main.appliance_detail', appliance_id=appliance.id) }}" class="btn btn-secondary">Cancel</a>
    </div>

</form>

{% endblock %}
