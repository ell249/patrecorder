{% extends "base.html" %}
{% block title %}New Test{% endblock %}
{% block content %}
<h3 class="mb-3">New Test for {{ appliance.asset_number }} — {{ appliance.description }}</h3>

<form method="post" enctype="multipart/form-data" class="row g-3">

  <input type="hidden" id="appliance_class" value="{{ appliance.class_type }}">
  <input type="hidden" id="appliance_supply" value="{{ appliance.supply_type }}">

  <div class="col-6 col-md-3">
    <label class="form-label">Test Date</label>
    <input type="date" name="test_date" class="form-control" required>
  </div>

  <div class="col-6 col-md-3">
    <label class="form-label">Tester</label>
    <input type="text" name="tester_name" class="form-control" required>
  </div>

  <div class="col-12 col-md-3">
    <label class="form-label">Test Type</label>
    <select name="test_type" class="form-select">
      <option value="Periodic">Periodic</option>
      <option value="Post-repair">Post-repair</option>
      <option value="New">New</option>
    </select>
  </div>

  <div class="col-12 col-md-6">
    <label class="form-label">Test Standard</label>
    <select name="test_standard" id="test_standard" class="form-select" required>
      <option value="3760" selected>In‑service Testing (AS/NZS 3760)</option>
      <option value="5761">Second‑hand Appliance (AS/NZS 5761 Appendix A)</option>
      <option value="5762">Repaired Appliance (AS/NZS 5762:2011)</option>
    </select>
  </div>

  <div class="col-12">
    <label class="form-label">Tag Number (for this test)</label>
    <input type="text" name="tag_number" class="form-control" required>
  </div>

  <div class="col-12 col-md-6">
    <label class="form-label">Recommended Re-Test Interval</label>
    <select name="retest_interval" id="retest_interval" class="form-select" required>
      <option value="">Select interval</option>
      {% for rule in rules %}
        <option value="{{ rule.interval_days }}"
                {% if suggested_rule and suggested_rule.id == rule.id %}selected{% endif %}>
          {{ rule.interval_days }} days — {{ rule.description }}
        </option>
      {% endfor %}
    </select>
  </div>

  <div class="col-6 col-md-3 form-check mt-4">
    <input class="form-check-input" type="checkbox" name="visual_pass" id="visual_pass">
    <label class="form-check-label" for="visual_pass">Visual Inspection Pass</label>
  </div>

  <div class="col-6 col-md-3">
    <label class="form-label">Earth Continuity (Ω)</label>
    <input type="number" step="0.001" name="earth_continuity_ohms" class="form-control">
  </div>

  <div class="col-6 col-md-3">
    <label class="form-label">Insulation (MΩ)</label>
    <input type="number" step="0.1" name="insulation_mohms" class="form-control">
  </div>

  <div class="col-6 col-md-3 form-check mt-4">
    <input class="form-check-input" type="checkbox" name="polarity_pass" id="polarity_pass">
    <label class="form-check-label" for="polarity_pass">Polarity Pass</label>
  </div>

  <div class="col-6 col-md-3">
    <label class="form-label">Leakage (mA)</label>
    <input type="number" step="0.1" name="leakage_mA" class="form-control">
  </div>

  <div class="col-6 col-md-3">
    <label class="form-label">Overall Result</label>
    <select name="overall_result" class="form-select" required>
      <option value="PASS">PASS</option>
      <option value="FAIL">FAIL</option>
    </select>
  </div>

  <div class="col-12">
    <label class="form-label">Comments</label>
    <textarea name="comments" class="form-control" rows="3"></textarea>
  </div>

  <div id="fields_5761" class="col-12 mt-3" style="display:none;">
    <h5>Additional Requirements for AS/NZS 5761</h5>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Condition Assessment</label>
        <textarea name="condition_assessment" class="form-control"></textarea>
      </div>
      <div class="col-md-6">
        <label class="form-label">Functional Check Result</label>
        <textarea name="functional_check" class="form-control"></textarea>
      </div>
      <div class="col-md-6">
        <label class="form-label">Accessories Included</label>
        <input type="text" name="accessories" class="form-control">
      </div>
      <div class="col-md-6">
        <label class="form-label">Is appliance safe for resale?</label>
        <select name="safe_for_resale" class="form-select">
          <option value="YES">YES</option>
          <option value="NO">NO</option>
        </select>
      </div>
    </div>
  </div>

  <div id="fields_5762" class="col-12 mt-3" style="display:none;">
    <h5>Additional Requirements for AS/NZS 5762</h5>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Repair Description</label>
        <textarea name="repair_description" class="form-control"></textarea>
      </div>
      <div class="col-md-6">
        <label class="form-label">Repaired By</label>
        <input type="text" name="repaired_by" class="form-control">
      </div>
      <div class="col-md-6">
        <label class="form-label">Parts Replaced</label>
        <textarea name="parts_replaced" class="form-control"></textarea>
      </div>
      <div class="col-md-6">
        <label class="form-label">Post‑repair Functional Test</label>
        <textarea name="post_repair_test" class="form-control"></textarea>
      </div>
    </div>
  </div>

  <div class="col-12">
    <label class="form-label">Photos (up to 10)</label>
    <input type="file" name="photos" class="form-control" accept="image/*" multiple>
  </div>

  <div class="col-12">
    <button type="submit" class="btn btn-primary">Save Test</button>
    <a href="{{ url_for('main.appliance_detail', appliance_id=appliance.id) }}"
       class="btn btn-secondary">Cancel</a>
  </div>
</form>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const select = document.getElementById("test_standard");
    const f5761 = document.getElementById("fields_5761");
    const f5762 = document.getElementById("fields_5762");

    function updateFields() {
        const val = select.value;
        f5761.style.display = "none";
        f5762.style.display = "none";
        if (val === "5761") {
            f5761.style.display = "block";
        } else if (val === "5762") {
            f5762.style.display = "block";
        }
    }

    select.addEventListener("change", updateFields);
    updateFields();
});
</script>
{% endblock %}
